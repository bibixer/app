<div>

<script>
    (function() {
        // ---------- INVENTORY DATA (complete with all required fields) ----------
        const INVENTORY = inventory

        // DOM elements
        const sidebar = document.getElementById('inventorySidebar');
        const toggleBtn = document.getElementById('toggleSidebarBtn');
        const closeBtn = document.getElementById('closeSidebarBtn');
        const cutterSelect = document.getElementById('cutterSelect');
        const soInput = document.getElementById('soInput');
        const dateInput = document.getElementById('dateInput');
        const resetBtn = document.getElementById('resetFiltersBtn');
        const inventoryListDiv = document.getElementById('inventoryList');
        const statsContainer = document.getElementById('statsContainer');
        const matchCountBadge = document.getElementById('matchCountBadge');
        const chipsContainer = document.getElementById('chipsContainer');

        // Filter state
        let filters = {
            cutter: '',
            so: '',
            date: '',
            name: ''
        };
        const nameFilter = document.getElementById('nameFilter');
if (nameFilter) {
    nameFilter.addEventListener('input', debounce(() => applyFiltersFromUI(), 180));
}

        // ---------- Helper: format date for display ----------
        function formatDateDisplay(dateStr) {
            if (!dateStr) return '—';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateStr;
        }

        // Escape HTML to prevent injection
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Populate cutter dropdown
        function populateCutterDropdown() {
            const cutters = [...new Set(INVENTORY.map(i => i.cutter_name))].sort();
            cutterSelect.innerHTML = '<option value="">All Cutters</option>';
            cutters.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                cutterSelect.appendChild(opt);
            });
        }

        // Efficient filtering logic (clean)
        function getFilteredItems() {
    return INVENTORY.filter(item => {
        if (filters.cutter && item.cutter_name !== filters.cutter) return false;
        if (filters.so && !String(item.so_no).includes(filters.so)) return false;
        if (filters.date && item.cutting_date !== filters.date) return false;
        if (filters.name && !item.name.toLowerCase().includes(filters.name.toLowerCase())) return false; // ADD THIS LINE
        return true;
    });
}

        // Render inventory cards (only inside sidebar)
        function renderInventory() {
            const filtered = getFilteredItems();
            const totalItems = filtered.length;
            const totalKg = filtered.reduce((sum, i) => sum + (i.kg || 0), 0);
            const totalPics = filtered.reduce((sum, i) => sum + (i.pics || 0), 0);

            // Update stats
            statsContainer.innerHTML = `
                <span class="inv-stat-badge">📋 ${totalItems} items</span>
                <span class="inv-stat-badge">⚖️ ${totalKg.toFixed(3)} kg</span>
                <span class="inv-stat-badge">🖼️ ${totalPics} pcs</span>
            `;
            if (matchCountBadge) matchCountBadge.innerText = `(${totalItems})`;

            if (filtered.length === 0) {
                inventoryListDiv.innerHTML = `
                    <div class="inv-empty-state">
                        <div class="inv-empty-icon">🔍</div>
                        <div>No matching items</div>
                        <div style="font-size:0.7rem; margin-top:6px;">Try adjusting filters</div>
                    </div>
                `;
                return;
            }

            let cardsHtml = '';
            filtered.forEach(item => {
                cardsHtml += `
                    <div class="inv-item-card">
                        <div class="inv-card-header">
                            <span class="inv-id-badge">ID: ${item.id}</span>
                            <span class="inv-name-badge">${escapeHtml(item.name)}</span>
                            <span class="inv-name-badge" > <a href=/edit/lump/${item.id}>edit</a></span>
                        </div>
                        <div class="inv-details-grid">

                            <div class="inv-detail-row"><span class="inv-detail-label">✂️ Cutter</span><span class="inv-detail-value">${escapeHtml(item.cutter_name)}</span></div>
                            <div class="inv-detail-row"><span class="inv-detail-label">🔢 SO No</span><span class="inv-detail-value">${item.so_no}</span></div>
                            <div class="inv-detail-row"><span class="inv-detail-label">📅 Date</span><span class="inv-detail-value">${formatDateDisplay(item.cutting_date)}</span></div>
                            <div class="inv-detail-row"><span class="inv-detail-label">🎨 Colour</span><span class="inv-detail-value">${escapeHtml(item.colour)}</span></div>
                            <div class="inv-detail-row"><span class="inv-detail-label">🖼️ Pics</span><span class="inv-detail-value">${item.pics}</span></div>
                            <div class="inv-detail-row"><span class="inv-detail-label">⚖️ KG</span><span class="inv-detail-value">${item.kg}</span></div>
                            <div class="inv-detail-row"><span class="inv-detail-label">📏 Avg Cloth</span><span class="inv-detail-value">${item.avg_cloth} mtr</span></div>
                            <div class="inv-detail-row"><span class="inv-detail-label">🏷️ Type</span><span class="inv-detail-value">${escapeHtml(item.type)}</span></div>
                        </div>
                    </div>
                `;
            });
            inventoryListDiv.innerHTML = cardsHtml;
        }

        // Update active filter chips & render
       function updateChipsAndRender() {
    const activeFilters = [];
    if (filters.cutter) activeFilters.push({ type: 'cutter', label: `✂️ ${filters.cutter}` });
    if (filters.so) activeFilters.push({ type: 'so', label: `🔢 SO-${filters.so}` });
    if (filters.date) activeFilters.push({ type: 'date', label: `📅 ${formatDateDisplay(filters.date)}` });
    if (filters.name) activeFilters.push({ type: 'name', label: `🏷️ ${filters.name}` }); // ADD THIS LINE

    if (activeFilters.length === 0) {
        chipsContainer.innerHTML = '<span style="color:#8ba0bc; font-size:0.7rem;">— none —</span>';
    } else {
        chipsContainer.innerHTML = activeFilters.map(f => `
            <span class="inv-chip">
                ${escapeHtml(f.label)}
                <span class="inv-chip-remove" data-filter-type="${f.type}">✕</span>
            </span>
        `).join('');
        document.querySelectorAll('#inventory-app-root .inv-chip-remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const type = btn.getAttribute('data-filter-type');
                removeSingleFilter(type);
            });
        });
    }
    renderInventory();
}

        // Remove individual filter chip
        function removeSingleFilter(type) {
    if (type === 'cutter') {
        filters.cutter = '';
        cutterSelect.value = '';
    } else if (type === 'so') {
        filters.so = '';
        soInput.value = '';
    } else if (type === 'date') {
        filters.date = '';
        dateInput.value = '';
    } else if (type === 'name') {  // ADD THIS BLOCK
        filters.name = '';
        document.getElementById('nameFilter').value = '';
    }
    updateChipsAndRender();
}


        // Apply all filters from UI (live)
       function applyFiltersFromUI() {
    filters.cutter = cutterSelect.value;
    filters.so = soInput.value.trim();
    filters.date = dateInput.value;
    filters.name = document.getElementById('nameFilter').value.trim(); // ADD THIS LINE
    updateChipsAndRender();
}


        // Reset everything
function resetAllFilters() {
    cutterSelect.value = '';
    soInput.value = '';
    dateInput.value = '';
    const nameInput = document.getElementById('nameFilter');
    if (nameInput) nameInput.value = '';
    filters = { cutter: '', so: '', date: '', name: '' }; // ADD name field
    updateChipsAndRender();
}

        // ---------- Debounce for live filtering ----------
        function debounce(func, delay = 200) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => func.apply(this, args), delay);
            };
        }

        // ---------- Sidebar Controls (no auto-open, toggle + outside + esc) ----------
        function initSidebarControls() {
            // toggle open/close
            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('inv-open');
                // update button text optional
                if (sidebar.classList.contains('inv-open')) {
                    toggleBtn.innerHTML = '🔒 Close Panel';
                } else {
                    toggleBtn.innerHTML = '🔍 Open Filter Panel';
                }
            });

            closeBtn.addEventListener('click', () => {
                sidebar.classList.remove('inv-open');
                toggleBtn.innerHTML = '🔍 Open Filter Panel';
            });

            // Click outside closes sidebar
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                    sidebar.classList.remove('inv-open');
                    toggleBtn.innerHTML = '🔍 Open Filter Panel';
                }
            });

            // ESC key closes
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    sidebar.classList.remove('inv-open');
                    toggleBtn.innerHTML = '🔍 Open Filter Panel';
                }
            });
        }

        // ---------- Initialize ----------
        function init() {
            populateCutterDropdown();
            initSidebarControls();

            // Live filtering (debounced inputs)
            const liveUpdate = debounce(() => applyFiltersFromUI(), 180);
            cutterSelect.addEventListener('change', liveUpdate);
            soInput.addEventListener('input', liveUpdate);
            dateInput.addEventListener('input', liveUpdate);
            resetBtn.addEventListener('click', resetAllFilters);

            // Initial render (all data shown)
            applyFiltersFromUI();

            // Ensure sidebar is hidden by default
            sidebar.classList.remove('inv-open');
            toggleBtn.innerHTML = '🔍 Open Filter Panel';
        }

        init();
    })();
</script>
</div>
