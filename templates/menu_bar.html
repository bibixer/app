<style>
  :root { --app-nav-height:64px; --app-nav-bg:#0f172a; --app-nav-panel:#172033; --app-nav-text:#e8eef8; --app-nav-muted:#9cabc2; }
  .app-navbar,.app-navbar *{box-sizing:border-box}.app-navbar{position:fixed;inset:0 0 auto 0;height:var(--app-nav-height);z-index:100000;display:flex;align-items:center;gap:18px;padding:0 18px;color:var(--app-nav-text);background:rgba(15,23,42,.97);border-bottom:1px solid rgba(255,255,255,.09);box-shadow:0 6px 24px rgba(15,23,42,.18);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  .app-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:max-content}.app-brand img{width:44px;height:36px;object-fit:contain;background:transparent;border-radius:0;padding:0}.app-brand-copy{line-height:1.05}.app-brand-title{display:block;font-size:15px;font-weight:800;letter-spacing:.03em}.app-brand-subtitle{display:block;color:var(--app-nav-muted);font-size:10px;margin-top:4px;text-transform:uppercase;letter-spacing:.09em}
  .app-nav-links{display:flex;align-items:center;gap:4px;flex:1;min-width:0;height:100%}.app-nav-link,.app-dropdown-button{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 11px;border:0;border-radius:9px;color:var(--app-nav-muted);background:transparent;text-decoration:none;font:600 13px/1 inherit;white-space:nowrap;cursor:pointer}.app-nav-link:hover,.app-dropdown-button:hover,.app-nav-link:focus-visible,.app-dropdown-button:focus-visible{color:#fff;background:rgba(255,255,255,.08);outline:none}.app-nav-link.active,.app-dropdown.active>.app-dropdown-button{color:#fff;background:linear-gradient(135deg,#526ff0,#7257dc);box-shadow:0 5px 14px rgba(82,111,240,.26)}.app-nav-icon{font-size:16px;line-height:1}
  .app-dropdown{position:relative}.app-dropdown-button::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px}.app-dropdown-menu{position:absolute;top:calc(100% + 10px);right:0;width:245px;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:var(--app-nav-panel);box-shadow:0 18px 45px rgba(2,6,23,.35);opacity:0;visibility:hidden;transform:translateY(-7px);transition:.16s ease}.app-dropdown:hover .app-dropdown-menu,.app-dropdown:focus-within .app-dropdown-menu,.app-dropdown.open .app-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}.app-dropdown-menu a{display:flex;gap:10px;align-items:center;padding:10px 11px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:600}.app-dropdown-menu a:hover,.app-dropdown-menu a.active{color:#fff;background:rgba(91,124,250,.18)}.app-menu-label{padding:8px 11px 5px;color:#7f90aa;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.app-menu-divider{height:1px;margin:6px 5px;background:rgba(255,255,255,.08)}
  .app-user{display:flex;align-items:center;gap:9px;min-width:max-content}.app-user-badge{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#273653;color:#fff;font-weight:800;font-size:13px}.app-logout{color:#fecaca}.app-menu-toggle{display:none;width:40px;height:40px;padding:0;border:0;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:22px}
  .app-drawer-overlay{position:fixed;inset:0;z-index:100001;background:rgba(2,6,23,.57);opacity:0;visibility:hidden;transition:.2s ease}.app-drawer{position:fixed;z-index:100002;inset:0 0 0 auto;width:min(88vw,340px);padding:15px;overflow:auto;color:var(--app-nav-text);background:var(--app-nav-bg);transform:translateX(102%);transition:.24s ease;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.app-drawer.open{transform:translateX(0)}.app-drawer-overlay.open{opacity:1;visibility:visible}.app-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 15px;border-bottom:1px solid rgba(255,255,255,.08)}.app-drawer-close{width:38px;height:38px;border:0;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font-size:24px;cursor:pointer}.app-drawer-group{margin-top:18px}.app-drawer-title{margin:0 10px 7px;color:#788ba7;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.app-drawer a{display:flex;align-items:center;gap:12px;padding:11px 12px;margin:3px 0;border-radius:9px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:650}.app-drawer a:hover,.app-drawer a.active{color:#fff;background:rgba(91,124,250,.2)}.app-nav-offset{height:var(--app-nav-height)}
  @media(max-width:1120px){.app-nav-link .app-nav-text{display:none}.app-nav-link{padding:0 12px}.app-brand-subtitle{display:none}}
  @media(max-width:760px){.app-navbar{padding:0 12px}.app-nav-links,.app-user .app-logout,.app-user-badge{display:none}.app-brand{flex:1}.app-menu-toggle{display:grid;place-items:center}.app-brand-subtitle{display:block}}
</style>

{% set endpoint = request.endpoint or '' %}

{% include 'simple_menu.html' %}
<script>
(()=>{const drawer=document.getElementById('appDrawer'),overlay=document.getElementById('appDrawerOverlay'),openButton=document.getElementById('appMenuOpen'),closeButton=document.getElementById('appMenuClose');if(!drawer||!overlay||!openButton||!closeButton)return;const setOpen=open=>{drawer.classList.toggle('open',open);overlay.classList.toggle('open',open);drawer.setAttribute('aria-hidden',String(!open));openButton.setAttribute('aria-expanded',String(open));document.documentElement.style.overflow=open?'hidden':''};openButton.addEventListener('click',()=>setOpen(true));closeButton.addEventListener('click',()=>setOpen(false));overlay.addEventListener('click',()=>setOpen(false));document.addEventListener('keydown',event=>{if(event.key==='Escape')setOpen(false)});document.querySelectorAll('.app-dropdown-button').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();const menu=button.closest('.app-dropdown');document.querySelectorAll('.app-dropdown.open').forEach(item=>{if(item!==menu)item.classList.remove('open')});menu.classList.toggle('open')}));document.addEventListener('click',()=>document.querySelectorAll('.app-dropdown.open').forEach(item=>item.classList.remove('open')))})();
</script>
