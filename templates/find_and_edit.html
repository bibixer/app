<div >
<div class="app-container">
    <div class="toolbar">
        <div class="header-row">
            <h2> based Hierarchy </h2>
            <div class="stats-badge" id="statsDisplay">📊 loading...</div>
        </div>

        <div class="level-selector" id="levelSelector">
            <div class="level-option" data-level="bale">📦 Top Level: Bale</div>
            <div class="level-option" data-level="lump">🔸 Top Level: Lump</div>
            <div class="level-option active" data-level="bundle">📦 Top Level: Bundle</div>
        </div>
        <div class="level-hint" id="levelHint">
            🔽 <strong>Bundle view</strong> → shows all Bundles with complete data
        </div>

        <div class="filter-row">
            <div class="filter-group">
                <label>🆔 ID (Bundle/Lump/Bale)</label>
                <input type="text" id="filterId" placeholder="8807, 8001, 79022">
            </div>
            <div class="filter-group">
                <label>✂️ Cutter / Given By</label>
                <input type="text" id="filterCutter" placeholder="RAJENDRA, chandan">
            </div>
            <div class="filter-group">
                <label>🔢 SO / bale number</label>
                <input type="text" id="filterSo" placeholder="202, 9090X1">
            </div>
            <div class="filter-group">
                <label>🏷️ Product</label>
                <input type="text" id="filterProduct" placeholder="MAHAMAYA 2MTR">
            </div>
            <div class="filter-group">
                <label>👥 Given To</label>
                <input type="text" id="filterGivenTo" placeholder="VIDYA">
            </div>
            <button id="resetFiltersBtn" class="reset-btn">⟳ Reset filters</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="hierarchy-table">
            <thead>
                <tr>
                    <th style="width: 48px"></th>
                    <th style="min-width: 240px">Main Info</th>
                    <th style="min-width: 280px">Details</th>
                    <th style="min-width: 180px">Metrics</th>
                    <th style="width: 110px">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ======================== BACKEND DATA IN EXACT FORMAT ========================
    // Frontend automatically builds Bale → Lump → Bundle hierarchy from this flat data
    const backendData = {{backend_data | tojson}} ;

    // ======================== AUTO BUILD HIERARCHY FROM FLAT DATA ========================
    function buildHierarchyFromBackendData(data) {
        const balesMap = new Map();      // bale_number -> bale object
        const lumpsMap = new Map();      // lump_id -> lump object
        const bundlesList = [];          // list of bundle objects

        // First pass: collect all unique bales and lumps
        data.forEach(record => {
            const type = record.type_B || (record.bundle_id ? 'bundle' : (record.lump_id ? 'lump' : 'bale'));

            // Extract bale info
            if (record.bale_number) {
                const baleKey = record.bale_number;
                if (!balesMap.has(baleKey)) {
                    balesMap.set(baleKey, {
                        id: record.bale_id || record.bale_number,
                        level: 'bale',
                        bale_id: record.bale_id,
                        bale_number: record.bale_number,
                        part_name: `Bale #${record.bale_number}`,
                        lot_number: '—',
                        lot_count: 0,
                        cutter: record.cutter || '—',
                        entry_datetime: record.entry_datetime || '—',
                        given_by: null,
                        given_date: null,
                        given_to: null,
                        product: 'Bale Header',
                        status: 'ACTIVE',
                        so_number: record.so_number,
                        kg: 0,
                        meter: 0,
                        pieces: 0,
                        color: '—'
                    });
                }
            }

            // Extract lump info (only if it has lump_id)
            if (record.lump_id) {
                const lumpKey = record.lump_id;
                if (!lumpsMap.has(lumpKey)) {
                    lumpsMap.set(lumpKey, {
                        id: record.lump_id,
                        level: 'lump',
                        lump_id: record.lump_id,
                        bale_number: record.bale_number,
                        bale_id: record.bale_id,
                        cutter: record.cutter,
                        entry_datetime: record.entry_datetime,
                        given_by: record.given_by,
                        given_date: record.given_date,
                        given_to: record.given_to,
                        kg: record.kg,
                        lot_number: record.lot_number,
                        meter: record.meter,
                        packing_date: record.packing_date,
                        pieces: record.pieces,
                        product: record.product,
                        status: record.status,
                        supplier: record.supplier,
                        type_B: record.type_B,
                        so_number: record.so_number,
                        meters_add_remove: record.meters_add_remove,
                        color: record.color
                    });
                }
            }

            // Collect bundles
            if (type === 'bundle' || record.bundle_id) {
                bundlesList.push({
                    id: record.bundle_id,
                    level: 'bundle',
                    bundle_id: record.bundle_id,
                    lump_id: record.lump_id,
                    bale_number: record.bale_number,
                    bale_id: record.bale_id,
                    cutter: record.cutter,
                    entry_datetime: record.entry_datetime,
                    given_by: record.given_by,
                    given_date: record.given_date,
                    given_to: record.given_to,
                    kg: record.kg,
                    lot_number: record.lot_number,
                    meter: record.meter,
                    packing_date: record.packing_date,
                    pieces: record.pieces,
                    product: record.product,
                    status: record.status,
                    supplier: record.supplier,
                    type_B: record.type_B,
                    so_number: record.so_number,
                    meters_add_remove: record.meters_add_remove || 0,
                    color: record.color
                });
            }
        });

        // Combine all into master array
        const masterArray = [];
        balesMap.forEach(bale => masterArray.push(bale));
        lumpsMap.forEach(lump => masterArray.push(lump));
        bundlesList.forEach(bundle => masterArray.push(bundle));

        return masterArray;
    }

    let masterData = buildHierarchyFromBackendData(backendData);
    let currentTopLevel = 'bundle';
    let expandedState = new Set();

    function initExpansions() {
        expandedState.clear();
        if (currentTopLevel === 'bale') {
            const allBaleIds = [...new Set(masterData.filter(i => i.level === 'bale').map(i => i.bale_id || i.bale_number))];
            allBaleIds.forEach(bid => expandedState.add(`bale_${bid}`));
            const allLumpIds = [...new Set(masterData.filter(i => i.level === 'lump').map(i => i.lump_id))];
            allLumpIds.forEach(lid => expandedState.add(`lump_${lid}`));
        } else if (currentTopLevel === 'lump') {
            const allLumpIds = [...new Set(masterData.filter(i => i.level === 'lump').map(i => i.lump_id))];
            allLumpIds.forEach(lid => expandedState.add(`lump_${lid}`));
        }
    }

    const tbody = document.getElementById('tableBody');
    const filterId = document.getElementById('filterId');
    const filterCutter = document.getElementById('filterCutter');
    const filterSo = document.getElementById('filterSo');
    const filterProduct = document.getElementById('filterProduct');
    const filterGivenTo = document.getElementById('filterGivenTo');
    const resetBtn = document.getElementById('resetFiltersBtn');
    const statsSpan = document.getElementById('statsDisplay');
    const levelHint = document.getElementById('levelHint');

    document.querySelectorAll('.level-option').forEach(opt => {
        opt.addEventListener('click', () => {
            const level = opt.dataset.level;
            if (level === currentTopLevel) return;
            currentTopLevel = level;
            document.querySelectorAll('.level-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');

            if (currentTopLevel === 'bale') {
                levelHint.innerHTML = '🔽 <strong>Bale view</strong> → shows Bale + nested Lumps + nested Bundles';
            } else if (currentTopLevel === 'lump') {
                levelHint.innerHTML = '🔽 <strong>Lump view</strong> → shows Lump + nested Bundles';
            } else {
                levelHint.innerHTML = '🔽 <strong>Bundle view</strong> → shows all Bundles with complete data';
            }
            initExpansions();
            renderTable();
        });
    });

    function itemPassesFilters(item) {
        const idVal = filterId.value.trim();
        if (idVal) {
            const idFields = [item.id, item.bundle_id, item.lump_id, item.bale_id, item.bale_number];
            const matches = idFields.some(f => f && String(f).includes(idVal));
            if (!matches) return false;
        }

        const cutterVal = filterCutter.value.trim().toLowerCase();
        if (cutterVal) {
            const cutterField = item.cutter || item.given_by || '';
            if (!cutterField.toLowerCase().includes(cutterVal)) return false;
        }

        const soVal = filterSo.value.trim().toLowerCase();
        if (soVal) {
            const soField = String(item.so_number || '');
            const lotField = String(item.bale_number || '');
            if (!soField.includes(soVal) && !lotField.includes(soVal)) return false;
        }

        const productVal = filterProduct.value.trim().toLowerCase();
        if (productVal) {
            const prodField = item.product || item.part_name || '';
            if (!prodField.toLowerCase().includes(productVal)) return false;
        }

        const givenToVal = filterGivenTo.value.trim().toLowerCase();
        if (givenToVal) {
            const givenToField = item.given_to || '';
            if (!givenToField.toLowerCase().includes(givenToVal)) return false;
        }

        return true;
    }

    function getHierarchyRows() {
        const rows = [];

        if (currentTopLevel === 'bale') {
            const bales = masterData.filter(i => i.level === 'bale').sort((a,b) => (a.bale_number||0) - (b.bale_number||0));
            for (const bale of bales) {
                if (!itemPassesFilters(bale)) continue;
                const baleKey = `bale_${bale.bale_id || bale.bale_number}`;
                const isExpanded = expandedState.has(baleKey);
                rows.push({ item: bale, level: 'bale', parentKey: null, isExpanded });
                if (isExpanded) {
                    const lumps = masterData.filter(i => i.level === 'lump' && i.bale_number === bale.bale_number);
                    for (const lump of lumps) {
                        if (!itemPassesFilters(lump)) continue;
                        const lumpKey = `lump_${lump.lump_id}`;
                        const isLumpExpanded = expandedState.has(lumpKey);
                        rows.push({ item: lump, level: 'lump', parentKey: baleKey, isExpanded: isLumpExpanded });
                        if (isLumpExpanded) {
                            const bundles = masterData.filter(i => i.level === 'bundle' && i.lump_id === lump.lump_id);
                            for (const bundle of bundles) {
                                if (!itemPassesFilters(bundle)) continue;
                                rows.push({ item: bundle, level: 'bundle', parentKey: lumpKey, isExpanded: false });
                            }
                        }
                    }
                }
            }
        }
        else if (currentTopLevel === 'lump') {
            const lumps = masterData.filter(i => i.level === 'lump').sort((a,b) => (a.lump_id||0) - (b.lump_id||0));
            for (const lump of lumps) {
                if (!itemPassesFilters(lump)) continue;
                const lumpKey = `lump_${lump.lump_id}`;
                const isExpanded = expandedState.has(lumpKey);
                rows.push({ item: lump, level: 'lump', parentKey: null, isExpanded });
                if (isExpanded) {
                    const bundles = masterData.filter(i => i.level === 'bundle' && i.lump_id === lump.lump_id);
                    for (const bundle of bundles) {
                        if (!itemPassesFilters(bundle)) continue;
                        rows.push({ item: bundle, level: 'bundle', parentKey: lumpKey, isExpanded: false });
                    }
                }
            }
        }
        else {
            const bundles = masterData.filter(i => i.level === 'bundle').sort((a,b) => (a.bundle_id||0) - (b.bundle_id||0));
            for (const bundle of bundles) {
                if (!itemPassesFilters(bundle)) continue;
                rows.push({ item: bundle, level: 'bundle', parentKey: null, isExpanded: false });
            }
        }
        return rows;
    }

    function renderDetails(item) {
        if (item.level === 'bale') {
            return `
                <div class="detail-line"><span class="detail-label">📦 Bale</span><span class="detail-value">#${item.bale_number}</span></div>
                <div class="detail-line"><span class="detail-label"> supplier </span><span class="detail-value">${escapeHtml(item.supplier || '—')}</span></div>
                <div class="detail-line"><span class="detail-label"> bale number</span><span class="detail-value">${escapeHtml(item.bale_number || '—')}</span></div>
                <div class="detail-line"><span class="detail-label"> lot number </span><span class="detail-value">${escapeHtml(item.lot_number || '—')}</span></div>
                <div class="detail-line"><span class="detail-label"> packing_date</span><span class="detail-value">${escapeHtml(item.packing_date || '—')}</span></div>
            `;
        }
        return `
            <div class="detail-line"><span class="detail-label">🆔 ${item.level === 'lump' ? 'Lump ID' : 'Bundle ID'}</span><span class="detail-value"><strong>${item.level === 'lump' ? item.lump_id : item.bundle_id}</strong></span></div>

            <div class="detail-line"><span class="detail-label">📦 Product</span><span class="detail-value">${escapeHtml(item.product || '—')}</span></div>
            <div class="detail-line"><span class="detail-label">🎨 Color</span><span class="detail-value">${escapeHtml(item.color || '—')}</span></div>

            <div class="detail-line"><span class="detail-label">✂️ Cutter</span><span class="detail-value">${escapeHtml(item.cutter || '—')}</span></div>
            ${item.given_by ? `
                <div class="detail-line"><span class="detail-label">👥 Given by</span><span class="detail-value"><strong>${escapeHtml(item.given_by)}</strong></span></div>
                <div class="detail-line"><span class="detail-label">🎯 Given to</span><span class="detail-value"><strong>${escapeHtml(item.given_to || '—')}</strong></span></div>
                <div class="detail-line"><span class="detail-label">📅 Given date</span><span class="detail-value">${escapeHtml(item.given_date || '—')}</span></div>
            ` : '<div class="detail-line"><span class="detail-label">👥 Given</span><span class="detail-value">Not given yet</span></div>'}
        `;
    }

    function renderMetrics(item) {
        if (item.level === 'bale') {
            return `<div class="metric-chip">🏷️ Bale #${item.bale_number ?? '—'}</div>`;
        }
        return `
            <div class="metric-chip">📏 ${item.meter ?? 0} m</div>
            ${item.meters_add_remove ? `<div class="metric-chip">➕ Δ ${item.meters_add_remove} m</div>` : ''}
            <div class="metric-chip">🔢 Pieces: ${item.pieces ?? 0}</div>
            <div class="metric-chip">⚖️ ${item.kg ?? 0} kg</div>
        `;
    }

    function getLevelIdentifier(item) {
        if (item.level === 'bale') return `Bale #${item.bale_number}`;
        if (item.level === 'lump') return `Lump ID ${item.lump_id} · ${item.product || ''}`;
        return `Bundle #${item.bundle_id} --${item.cutter} --${item.so_number} · ${item.product || ''}`;
    }

    function getEditUrl(item) {
        if (item.level === 'bale') return `/edit/bale/${item.bale_id || item.bale_number}`;
        if (item.level === 'lump') return `/edit/lump/${item.lump_id}`;
        return `/edit/bundle/${item.bundle_id}`;
    }

    function toggleExpand(levelType, id) {
        const key = `${levelType}_${id}`;
        if (expandedState.has(key)) expandedState.delete(key);
        else expandedState.add(key);
        renderTable();
    }

    function renderTable() {
        const rowsData = getHierarchyRows();
        statsSpan.innerText = `📊 ${rowsData.length} visible · ${masterData.length} total`;

        if (rowsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="no-data">✨ No records match filters ✨</td></tr>`;
            return;
        }

        let html = '';
        for (const row of rowsData) {
            const item = row.item;
            const levelClass = item.level === 'bale' ? 'bale-row' : (item.level === 'lump' ? 'lump-row' : 'bundle-row');
            const badgeClass = item.level === 'bale' ? 'badge-bale' : (item.level === 'lump' ? 'badge-lump' : 'badge-bundle');
            const identifier = getLevelIdentifier(item);

            let showExpand = false, expandId = null, expandLevelType = null, isExpanded = false;
            if (item.level === 'bale' && currentTopLevel === 'bale') {
                showExpand = true; expandId = item.bale_id || item.bale_number; expandLevelType = 'bale'; isExpanded = row.isExpanded;
            } else if (item.level === 'lump' && (currentTopLevel === 'bale' || currentTopLevel === 'lump')) {
                const hasBundles = masterData.some(b => b.level === 'bundle' && b.lump_id === item.lump_id);
                if (hasBundles) {
                    showExpand = true; expandId = item.lump_id; expandLevelType = 'lump'; isExpanded = row.isExpanded;
                }
            }

            const editUrl = getEditUrl(item);
            let statusColor = '#94a3b8';
            if (item.status === 'GIVEN') statusColor = '#22c55e';
            else if (item.status === 'ACTIVE' || item.status === 'READY') statusColor = '#22c55e';
            else if (item.status === 'PACKED') statusColor = '#f97316';

            html += `<tr class="${levelClass}">
                <td>${showExpand && expandId ? `<span class="expand-icon" onclick="toggleExpand('${expandLevelType}', '${expandId}')">${isExpanded ? '−' : '+'}</span>` : ''}</td>
                <td>
                    <div class="main-card">
                        <div class="title-row">
                            <span class="level-badge ${badgeClass}">${item.level.toUpperCase()}</span>
                            <strong>${escapeHtml(identifier)}</strong>
                        </div>
                        <div class="sub-info">
                            📅 ${escapeHtml(item.entry_datetime || '—')}
                            <span class="status-dot" style="background:${statusColor}"></span>
                            <span>${item.status || '—'}</span>
                        </div>
                        ${item.given_by ? `<div class="given-badge">🎁 Given: ${escapeHtml(item.given_by)} → ${escapeHtml(item.given_to || '?')}</div>` : ''}
                    </div>
                </td>
                <td>${renderDetails(item)}</td>
                <td><div class="metrics-grid">${renderMetrics(item)}</div></td>
                <td><a href="${editUrl}" class="edit-link" target="_blank">✏️ Edit</a><div class="subnote">redirect</div></td>
            </tr>`;
        }
        tbody.innerHTML = html;
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    function resetFilters() {
        filterId.value = ''; filterCutter.value = ''; filterSo.value = ''; filterProduct.value = ''; filterGivenTo.value = '';
        renderTable();
    }

    function attachFilterEvents() {
        [filterId, filterCutter, filterSo, filterProduct, filterGivenTo].forEach(f => f.addEventListener('input', () => renderTable()));
        resetBtn.addEventListener('click', resetFilters);
    }

    window.toggleExpand = toggleExpand;
    initExpansions();
    attachFilterEvents();
    renderTable();
</script>
</div>
