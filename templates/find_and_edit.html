        {

            product: 'SILK EMBROIDERY', color: 'MAROON', pieces: 15, kg: 4.8,
            type_B: 'bundle', no_of_so: 606, status: 'READY',
            entry_datetime: '2026-03-23 09:30:00',
            given_by: 'anita', given_date: 'Tue, 24 Mar 2026 10:00:00 GMT',
            given_to: 'FASHION_HOUSE'
        },

        // Additional lumps with bundles (for Lump view testing)
        {
            id: 2001, level: 'lump', lump_id: 888, bale_number: 1, bale_id: 1,
            cutter: 'SURESH', entry_datetime: '2026-03-19 09:15:22',
            given_by: null, given_date: null, given_to: null,
            product: 'PREMIUM 3MTR', status: 'PACKED', so_number: 202,
            cut_by: 'SURESH', bundle_type: 'fant', meters: 88.2,
            meters_add_remove: 0, color: 'GOLD', number_of_bundlie: 5
        },

        // Bale data for Bale view
        {
            id: 1001, level: 'bale', bale_id: 1, bale_number: 1,
            part_name: 'COTTON RAW', lot_number: 9090, lot_count: 150,
            cutter: 'RAJENDRA', entry_datetime: '2026-03-18 10:30:00',
            so_number: 101, status: 'ACTIVE'
        }
    ];

    let masterData = baseData.map(i => ({ ...i }));

    // DEFAULT TOP LEVEL = BUNDLE
    let currentTopLevel = 'bundle';

    // Expand/collapse state
    let expandedState = new Set();

    function initExpansions() {
        expandedState.clear();
        if (currentTopLevel === 'bale') {
            const allBaleIds = [...new Set(masterData.filter(i => i.level === 'bale').map(i => i.bale_id))];
            allBaleIds.forEach(bid => expandedState.add(`bale_${bid}`));
            const allLumpIds = [...new Set(masterData.filter(i => i.level === 'lump').map(i => i.lump_id))];
            allLumpIds.forEach(lid => expandedState.add(`lump_${lid}`));
        } else if (currentTopLevel === 'lump') {
            const allLumpIds = [...new Set(masterData.filter(i => i.level === 'lump').map(i => i.lump_id))];
            allLumpIds.forEach(lid => expandedState.add(`lump_${lid}`));
        }
    }

    // DOM elements
    const tbody = document.getElementById('tableBody');
    const filterBundleId = document.getElementById('filterBundleId');
    const filterCutter = document.getElementById('filterCutter');
    const filterSo = document.getElementById('filterSo');
    const filterProduct = document.getElementById('filterProduct');
    const filterGivenTo = document.getElementById('filterGivenTo');
    const resetBtn = document.getElementById('resetFiltersBtn');
    const statsSpan = document.getElementById('statsDisplay');
    const levelHint = document.getElementById('levelHint');

    // Level selector event
    document.querySelectorAll('.level-option').forEach(opt => {
        opt.addEventListener('click', () => {
            const level = opt.dataset.level;
            if (level === currentTopLevel) return;
            currentTopLevel = level;
            document.querySelectorAll('.level-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');

            if (currentTopLevel === 'bale') {
                levelHint.innerHTML = '🔽 <strong>Bale view</strong> → shows Bale + nested Lumps + nested Bundles';
            } else if (currentTopLevel === 'lump') {
                levelHint.innerHTML = '🔽 <strong>Lump view</strong> → shows Lump + nested Bundles';
            } else {
                levelHint.innerHTML = '🔽 <strong>Bundle view</strong> → shows all Bundles with Given By / Given To information';
            }

            initExpansions();
            renderTable();
        });
    });

    function itemPassesFilters(item) {
        // Bundle ID filter (only applies to bundle level items)
        const bundleIdVal = filterBundleId.value.trim();
        if (bundleIdVal && item.level === 'bundle') {
            const bundleIdStr = String(item.bundle_id || '');
            if (!bundleIdStr.includes(bundleIdVal)) return false;
        }

        const cutterVal = filterCutter.value.trim().toLowerCase();
        if (cutterVal) {
            const cutterField = item.cutter || item.cut_by || item.given_by || '';
            if (!cutterField.toLowerCase().includes(cutterVal)) return false;
        }

        const soVal = filterSo.value.trim().toLowerCase();
        if (soVal) {
            const soField = String(item.so_number || item.no_of_so || '');
            const lotField = String(item.lot_number || '');
            if (!soField.includes(soVal) && !lotField.includes(soVal)) return false;
        }

        const productVal = filterProduct.value.trim().toLowerCase();
        if (productVal) {
            const prodField = item.product || item.part_name || '';
            if (!prodField.toLowerCase().includes(productVal)) return false;
        }

        const givenToVal = filterGivenTo.value.trim().toLowerCase();
        if (givenToVal) {
            const givenToField = item.given_to || '';
            if (!givenToField.toLowerCase().includes(givenToVal)) return false;
        }

        return true;
    }

    function getHierarchyRows() {
        const rows = [];

        if (currentTopLevel === 'bale') {
            const bales = masterData.filter(i => i.level === 'bale').sort((a,b) => (a.bale_number||0) - (b.bale_number||0));
            for (const bale of bales) {
                if (!itemPassesFilters(bale)) continue;
                const baleKey = `bale_${bale.bale_id}`;
                const isExpanded = expandedState.has(baleKey);
                rows.push({ item: bale, level: 'bale', parentKey: null, isExpanded, depth: 0 });
                if (isExpanded) {
                    const lumps = masterData.filter(i => i.level === 'lump' && i.bale_number === bale.bale_number);
                    for (const lump of lumps) {
                        if (!itemPassesFilters(lump)) continue;
                        const lumpKey = `lump_${lump.lump_id}`;
                        const isLumpExpanded = expandedState.has(lumpKey);
                        rows.push({ item: lump, level: 'lump', parentKey: baleKey, isExpanded: isLumpExpanded, depth: 1 });
                        if (isLumpExpanded) {
                            const bundles = masterData.filter(i => i.level === 'bundle' && i.lump_id === lump.lump_id);
                            for (const bundle of bundles) {
                                if (!itemPassesFilters(bundle)) continue;
                                rows.push({ item: bundle, level: 'bundle', parentKey: lumpKey, isExpanded: false, depth: 2 });
                            }
                        }
                    }
                }
            }
        }
        else if (currentTopLevel === 'lump') {
            const lumps = masterData.filter(i => i.level === 'lump').sort((a,b) => (a.lump_id||0) - (b.lump_id||0));
            for (const lump of lumps) {
                if (!itemPassesFilters(lump)) continue;
                const lumpKey = `lump_${lump.lump_id}`;
                const isExpanded = expandedState.has(lumpKey);
                rows.push({ item: lump, level: 'lump', parentKey: null, isExpanded, depth: 0 });
                if (isExpanded) {
                    const bundles = masterData.filter(i => i.level === 'bundle' && i.lump_id === lump.lump_id);
                    for (const bundle of bundles) {
                        if (!itemPassesFilters(bundle)) continue;
                        rows.push({ item: bundle, level: 'bundle', parentKey: lumpKey, isExpanded: false, depth: 1 });
                    }
                }
            }
        }
        else {
            // BUNDLE view - flat list, includes given_by and given_to
            const bundles = masterData.filter(i => i.level === 'bundle').sort((a,b) => (a.bundle_id||0) - (b.bundle_id||0));
            for (const bundle of bundles) {
                if (!itemPassesFilters(bundle)) continue;
                rows.push({ item: bundle, level: 'bundle', parentKey: null, isExpanded: false, depth: 0 });
            }
        }

        return rows;
    }

    function renderDetails(item) {
        if (item.level === 'bale') {
            return `
                <div class="detail-line"><span class="detail-label">📦 Part</span><span class="detail-value">${escapeHtml(item.part_name || '—')}</span></div>
                <div class="detail-line"><span class="detail-label">🔢 Lot</span><span class="detail-value">${item.lot_number ?? '—'}</span></div>
                <div class="detail-line"><span class="detail-label">📊 Lot count</span><span class="detail-value">${item.lot_count ?? '—'}</span></div>
            `;
        }
        if (item.level === 'lump') {
            return `
                <div class="detail-line"><span class="detail-label">✂️ Cut by</span><span class="detail-value">${escapeHtml(item.cut_by || item.cutter || '—')}</span></div>
                <div class="detail-line"><span class="detail-label">🧵 Product</span><span class="detail-value">${escapeHtml(item.product || '—')}</span></div>
                <div class="detail-line"><span class="detail-label">🎨 Color</span><span class="detail-value">${escapeHtml(item.color || '—')}</span></div>
                <div class="detail-line"><span class="detail-label">📦 Bundle type</span><span class="detail-value">${escapeHtml(item.bundle_type || '—')}</span></div>
                ${item.given_by ? `<div class="detail-line"><span class="detail-label">👥 Given by</span><span class="detail-value">${escapeHtml(item.given_by)}</span></div>` : ''}
                ${item.given_to ? `<div class="detail-line"><span class="detail-label">🎯 Given to</span><span class="detail-value">${escapeHtml(item.given_to)}</span></div>` : ''}
                ${item.given_date ? `<div class="detail-line"><span class="detail-label">📅 Given date</span><span class="detail-value">${escapeHtml(item.given_date)}</span></div>` : ''}
            `;
        }
        // BUNDLE view - includes given_by and given_to prominently
        return `
            <div class="detail-line"><span class="detail-label">🆔 Bundle ID</span><span class="detail-value"><strong>${item.bundle_id ?? '—'}</strong></span></div>
            <div class="detail-line"><span class="detail-label">🧵 Product</span><span class="detail-value">${escapeHtml(item.product || '—')}</span></div>
            <div class="detail-line"><span class="detail-label">🎨 Color</span><span class="detail-value">${escapeHtml(item.color || '—')}</span></div>
            <div class="detail-line"><span class="detail-label">📄 SO ref</span><span class="detail-value">${item.no_of_so ?? item.so_number ?? '—'}</span></div>
            <div class="detail-line"><span class="detail-label">🏷️ type_B</span><span class="detail-value">${escapeHtml(item.type_B || 'bundle')}</span></div>
            ${item.given_by ? `
                <div class="detail-line"><span class="detail-label">👥 Given by</span><span class="detail-value"><strong>${escapeHtml(item.given_by)}</strong></span></div>
                <div class="detail-line"><span class="detail-label">🎯 Given to</span><span class="detail-value"><strong>${escapeHtml(item.given_to || '—')}</strong></span></div>
                <div class="detail-line"><span class="detail-label">📅 Given date</span><span class="detail-value">${escapeHtml(item.given_date || '—')}</span></div>
            ` : '<div class="detail-line"><span class="detail-label">👥 Given</span><span class="detail-value">Not given yet</span></div>'}
        `;
    }

    function renderMetrics(item) {
        if (item.level === 'bale') {
            return `<div class="metric-chip">🏷️ Bale #${item.bale_number ?? '—'}</div>`;
        }
        if (item.level === 'lump') {
            return `
                <div class="metric-chip">📏 ${item.meters ?? item.meter ?? 0} m</div>
                <div class="metric-chip">📦 Bundles: ${item.number_of_bundlie ?? 0}</div>
            `;
        }
        return `
            <div class="metric-chip">🔢 Pieces: ${item.pieces ?? 0}</div>
            <div class="metric-chip">⚖️ ${item.kg ?? 0} kg</div>
        `;
    }

    function getLevelIdentifier(item) {
        if (item.level === 'bale') return `Bale #${item.bale_number} · ${item.part_name || ''}`;
        if (item.level === 'lump') return `Lump ID ${item.lump_id} · ${item.product || ''}`;
        return `Bundle #${item.bundle_id} · ${item.product || ''}`;
    }

    function getEditUrl(item) {
        if (item.level === 'bale') return `/edit/bale/${item.bale_id}`;
        if (item.level === 'lump') return `/edit/lump/${item.lump_id}`;
        if (item.level === 'bundle') return `/edit/bundle/${item.bundle_id}`;
        return '#';
    }

    function toggleExpand(levelType, id) {
        const key = `${levelType}_${id}`;
        if (expandedState.has(key)) expandedState.delete(key);
        else expandedState.add(key);
        renderTable();
    }

    function renderTable() {
        const rowsData = getHierarchyRows();
        const totalVisible = rowsData.length;
        statsSpan.innerText = `📊 ${totalVisible} visible · ${masterData.length} total (top: ${currentTopLevel})`;

        if (rowsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="no-data">✨ No records match filters. Try resetting filters. ✨</td></tr>`;
            return;
        }

        let html = '';
        for (const row of rowsData) {
            const item = row.item;
            const levelClass = row.level === 'bale' ? 'bale-row' : (row.level === 'lump' ? 'lump-row' : 'bundle-row');
            const badgeClass = row.level === 'bale' ? 'badge-bale' : (row.level === 'lump' ? 'badge-lump' : 'badge-bundle');
            const identifier = getLevelIdentifier(item);

            let showExpand = false;
            let expandId = null;
            let expandLevelType = null;
            let isExpanded = false;

            if (row.level === 'bale' && currentTopLevel === 'bale') {
                showExpand = true;
                expandId = item.bale_id;
                expandLevelType = 'bale';
                isExpanded = row.isExpanded;
            } else if (row.level === 'lump' && (currentTopLevel === 'bale' || currentTopLevel === 'lump')) {
                const hasBundles = masterData.some(b => b.level === 'bundle' && b.lump_id === item.lump_id);
                if (hasBundles) {
                    showExpand = true;
                    expandId = item.lump_id;
                    expandLevelType = 'lump';
                    isExpanded = row.isExpanded;
                }
            }

            const editUrl = getEditUrl(item);
            let statusColor = '#94a3b8';
            if (item.status === 'GIVEN') statusColor = '#22c55e';
            else if (item.status === 'ACTIVE' || item.status === 'READY') statusColor = '#22c55e';
            else if (item.status === 'PACKED') statusColor = '#f97316';

            html += `<tr class="${levelClass}">
                <td style="text-align:center; vertical-align:middle;">
                    ${showExpand && expandId ?
                        `<span class="expand-icon" onclick="toggleExpand('${expandLevelType}', '${expandId}')">${isExpanded ? '−' : '+'}</span>`
                        : '<span style="display:inline-block; width:28px;"></span>'}
                </td>
                <td>
                    <div class="main-card">
                        <div class="title-row">
                            <span class="level-badge ${badgeClass}">${row.level.toUpperCase()}</span>
                            <strong>${escapeHtml(identifier)}</strong>
                        </div>
                        <div class="sub-info">
                            📅 ${escapeHtml(item.entry_datetime || '—')}
                            <span class="status-dot" style="background:${statusColor}"></span>
                            <span>${item.status || '—'}</span>
                        </div>
                        ${item.given_by && row.level === 'bundle' ? `<div class="given-badge">🎁 Given: ${escapeHtml(item.given_by)} → ${escapeHtml(item.given_to || '?')}</div>` : ''}
                    </div>
                </td>
                <td>
                    <div class="details-panel">
                        ${renderDetails(item)}
                    </div>
                </td>
                <td>
                    <div class="metrics-grid">
                        ${renderMetrics(item)}
                    </div>
                </td>
                <td>
                    <a href="${editUrl}" class="edit-link" target="_blank" rel="noopener noreferrer">
                        ✏️ Edit ${row.level}
                    </a>
                    <div class="subnote">redirects to page</div>
                </td>
              </tr>`;
        }
        tbody.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function resetFilters() {
        filterBundleId.value = '';
        filterCutter.value = '';
        filterSo.value = '';
        filterProduct.value = '';
        filterGivenTo.value = '';
        renderTable();
    }

    function attachFilterEvents() {
        filterBundleId.addEventListener('input', () => renderTable());
        filterCutter.addEventListener('input', () => renderTable());
        filterSo.addEventListener('input', () => renderTable());
        filterProduct.addEventListener('input', () => renderTable());
        filterGivenTo.addEventListener('input', () => renderTable());
        resetBtn.addEventListener('click', resetFilters);
    }

    window.toggleExpand = toggleExpand;
    initExpansions();
    attachFilterEvents();
    renderTable();
</script>
</div>
