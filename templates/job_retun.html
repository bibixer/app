<!doctype html>
<html lang="en">
  {% include "menu_bar.html" %}
  <head>
    <meta charset="UTF-8" />
    <title>Job Return entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --active-row: #eef2ff;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 40px 20px;
      }

      .card {
        width: 90%;
        max-width: 1400px;
        margin: auto;
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .card-header {
        padding: 24px 32px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-main);
      }

      .job-info-bar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: #f1f5f9;
        padding: 16px 32px;
        gap: 24px;
      }
      .info-group label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 4px;
        font-weight: 600;
      }
      .info-group span {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-main);
      }

      .table-container {
        padding: 0 16px;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      th {
        text-align: left;
        padding: 16px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        border-bottom: 2px solid var(--border);
        background: #f8fafc;
      }

      td {
        padding: 16px 12px;
        vertical-align: top;
        border-bottom: 1px solid var(--border);
        transition: background-color 0.2s;
      }

      tr.active-row {
        background-color: var(--active-row);
      }

      .id-badge {
        font-family: monospace;
        color: var(--primary);
        font-weight: 600;
      }

      .remaining-badge {
        background: #dcfce7;
        color: #166534;
        padding: 4px 10px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
        display: inline-block;
      }
      .remaining-badge.low {
        background: #fee2e2;
        color: #991b1b;
      }

      .return-input {
        width: 100px;
        padding: 8px 12px;
        border: 2px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        transition: all 0.2s;
        font-weight: 500;
      }
      .return-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        background: #fff;
      }

      /* Calculator Styles */
      .calculator {
        margin-top: 0;
        padding: 8px;
        background: #f8fafc;
        border-radius: 8px;
        border-left: 3px solid var(--primary);
      }
      .calculator-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .calc-rows-container {
        max-height: 200px;
        overflow-y: auto;
      }
      .calc-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
        flex-wrap: wrap;
        padding: 6px;
        background: white;
        border-radius: 6px;
        border: 1px solid var(--border);
        transition: all 0.2s;
      }
      .calc-row:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
      }
      .calc-input {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .calc-input label {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .calc-input input {
        width: 60px;
        padding: 4px 6px;
        font-size: 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        text-align: center;
      }
      .calc-input input:focus {
        outline: none;
        border-color: var(--primary);
      }
      .calc-total {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary);
        margin-left: 4px;
        min-width: 40px;
      }
      .remove-calc-btn {
        background: #ef4444;
        color: white;
        border: none;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
        transition: background 0.2s;
        margin-left: auto;
      }
      .remove-calc-btn:hover {
        background: #dc2626;
      }
      .calc-summary {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .apply-calc-btn {
        background: #10b981;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .apply-calc-btn:hover {
        background: #059669;
      }

      .history-toggle {
        cursor: pointer;
        color: var(--primary);
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .history-content {
        display: none;
        background: #f8fafc;
        margin: 8px 0;
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
        border-left: 3px solid var(--primary);
      }
      .history-item {
        padding: 4px 0;
        color: var(--text-muted);
      }
      .history-item b {
        color: var(--text-main);
      }

      .card-footer {
        padding: 24px 32px;
        background: #ffffff;
        text-align: right;
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        padding: 12px 32px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-size: 14px;
      }
      .btn-submit:hover {
        background: var(--primary-hover);
      }
      .btn-submit:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
      }

      .chevron {
        transition: transform 0.2s;
        display: inline-block;
      }
      .chevron.open {
        transform: rotate(90deg);
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(
          315deg,
          rgba(101, 0, 94, 1) 3%,
          rgba(60, 132, 206, 1) 38%,
          rgba(48, 238, 226, 1) 68%,
          rgba(255, 25, 25, 1) 98%
        );
        animation: gradient 15s ease infinite;
        background-size: 400% 400%;
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 0%;
        }
        50% {
          background-position: 100% 100%;
        }
        100% {
          background-position: 0% 0%;
        }
      }

      .wave {
        background: rgb(255 255 255 / 25%);
        border-radius: 1000% 1000% 0 0;
        position: fixed;
        width: 200%;
        height: 12em;
        animation: wave 10s -3s linear infinite;
        transform: translate3d(0, 0, 0);
        opacity: 0.8;
        bottom: 0;
        left: 0;
        z-index: -1;
      }

      .wave:nth-of-type(2) {
        bottom: -1.25em;
        animation: wave 18s linear reverse infinite;
        opacity: 0.8;
      }

      .wave:nth-of-type(3) {
        bottom: -2.5em;
        animation: wave 20s -1s reverse infinite;
        opacity: 0.9;
      }

      @keyframes wave {
        2% {
          transform: translateX(1);
        }
        25% {
          transform: translateX(-25%);
        }
        50% {
          transform: translateX(-50%);
        }
        75% {
          transform: translateX(-25%);
        }
        100% {
          transform: translateX(1);
        }
      }

      .shortcut-hint {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12px;
        font-family: monospace;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>Job Card Return</h2>
      </div>

      <div class="job-info-bar">
        <div class="info-group">
          <label>Master Name</label>
          <span id="jobName"></span>
        </div>
        <div class="info-group">
          <label>Date</label>
          <span id="jobDate"></span>
        </div>
      </div>

      <div class="table-container">
        <table id="returnTable">
          <thead>
            <tr>
              <th style="width: 5%">#</th>
              <th style="width: 20%">Product Name</th>
              <th style="width: 10%">Type</th>
              <th style="width: 10%">Balance</th>
              <th style="width: 12%">Return </th>
              <th style="width: 43%">Quick Calc </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="card-footer">
        <button onclick="submitReturn()" class="btn-submit">
          ✓ Confirm Return (Ctrl+A)
        </button>
      </div>
    </div>

    <script>
      const JOB_CARD = {{ data | tojson}};
    </script>
    <script src="static/js/retun.js">
    </script>
  </body>
</html>
