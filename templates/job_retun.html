  <head>
    <meta charset="UTF-8" />
    <title>Job Return entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 40px 20px;
      }

      .card {
        width: 90%; /* make it wider */
        max-width: 1200px; /* limit max width */
        margin: auto;
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .card-header {
        padding: 24px 32px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-main);
      }

      /* Top Stats Bar */
      .job-info-bar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: #f1f5f9;
        padding: 16px 32px;
        gap: 24px;
      }
      .info-group label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 4px;
        font-weight: 600;
      }
      .info-group span {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-main);
      }

      /* Table Styling */
      .table-container {
        padding: 0 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      th {
        text-align: left;
        padding: 16px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        border-bottom: 2px solid var(--border);
      }

      td {
        padding: 16px 12px;
        vertical-align: middle;
        border-bottom: 1px solid var(--border);
      }

      /* Inputs & Badges */
      .id-badge {
        font-family: monospace;
        color: var(--primary);
        font-weight: 600;
      }

      .remaining-badge {
        background: #dcfce7;
        color: #166534;
        padding: 4px 10px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
      }
      .remaining-badge.low {
        background: #fee2e2;
        color: #991b1b;
      }

      input[type="number"] {
        width: 80px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      input[type="number"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      /* History Styling */
      .history-toggle {
        cursor: pointer;
        color: var(--primary);
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .history-content {
        display: none;
        background: #f8fafc;
        margin: 8px 0;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        border-left: 3px solid var(--primary);
      }
      .history-item {
        padding: 4px 0;
        color: var(--text-muted);
      }
      .history-item b {
        color: var(--text-main);
      }

      /* Footer */
      .card-footer {
        padding: 24px 32px;
        background: #ffffff;
        text-align: right;
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        padding: 12px 32px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-submit:hover {
        background: var(--primary-hover);
      }

      .chevron {
        transition: transform 0.2s;
        display: inline-block;
      }
      .chevron.open {
        transform: rotate(90deg);
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(
          315deg,
          rgba(101, 0, 94, 1) 3%,
          rgba(60, 132, 206, 1) 38%,
          rgba(48, 238, 226, 1) 68%,
          rgba(255, 25, 25, 1) 98%
        );
        animation: gradient 15s ease infinite;
        background-size: 400% 400%;
        background-attachment: fixed;

        /* Center card */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* full viewport height */
        padding: 20px; /* space on small screens */
      }

      @keyframes gradient {
        0% {
          background-position: 0% 0%;
        }
        50% {
          background-position: 100% 100%;
        }
        100% {
          background-position: 0% 0%;
        }
      }

      .wave {
        background: rgb(255 255 255 / 25%);
        border-radius: 1000% 1000% 0 0;
        position: fixed;
        width: 200%;
        height: 12em;
        animation: wave 10s -3s linear infinite;
        transform: translate3d(0, 0, 0);
        opacity: 0.8;
        bottom: 0;
        left: 0;
        z-index: -1;
      }

      .wave:nth-of-type(2) {
        bottom: -1.25em;
        animation: wave 18s linear reverse infinite;
        opacity: 0.8;
      }

      .wave:nth-of-type(3) {
        bottom: -2.5em;
        animation: wave 20s -1s reverse infinite;
        opacity: 0.9;
      }

      @keyframes wave {
        2% {
          transform: translateX(1);
        }

        25% {
          transform: translateX(-25%);
        }

        50% {
          transform: translateX(-50%);
        }

        75% {
          transform: translateX(-25%);
        }

        100% {
          transform: translateX(1);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="wave"></div>

    <div class="card">
