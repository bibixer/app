<script>
document.addEventListener("DOMContentLoaded", function () {

  // Better desktop detection (more reliable than touch check)
  const isPC = window.matchMedia("(pointer: fine)").matches;
  const forms = document.querySelectorAll(".form-container form");

  forms.forEach(form => {
    form.addEventListener("submit", function (event) {
      if (form.dataset.submitting === "true") {
        event.preventDefault();
        return;
      }
      form.dataset.submitting = "true";
      const button = form.querySelector("button[type=submit], input[type=submit]");
      if (button) setTimeout(() => { button.disabled = true; }, 0);
    });
  });

  if (!isPC) return;

  forms.forEach(form => {

    const inputs = Array.from(
      form.querySelectorAll("input, textarea, select")
    ).filter(el =>
      el.type !== "submit" &&
      !el.disabled &&
      !el.readOnly &&
      el.offsetParent !== null
    );

    const isEmpty = (el) => {
      if (el.tagName === "SELECT") return false;
      return !el.value || el.value.trim() === "";
    };

    const focusAndMoveCursorToEnd = (el) => {

      inputs.forEach(i => i.classList.remove("focused-field"));

      el.classList.add("focused-field");
      el.focus();
      el.scrollIntoView({ behavior: "smooth", block: "center" });

      if (el.tagName === "SELECT") return;

      const safeTextTypes = [
        "text", "search", "tel", "url",
        "password", "email"
      ];

      if (safeTextTypes.includes(el.type)) {
        const len = el.value.length;
        requestAnimationFrame(() => {
          try {
            el.setSelectionRange(len, len);
          } catch (err) {
            // silently ignore unsupported types
          }
        });
      }

      else if (el.type === "number") {
        const val = el.value;
        el.blur();
        el.focus();
        el.value = "";
        el.value = val;
      }

      // date/time/color/etc just focus only
    };

    // Initial focus logic
    let focusField = inputs.find(el => isEmpty(el));
    if (!focusField && inputs.length > 0) focusField = inputs[0];

    if (focusField) {
      requestAnimationFrame(() => {
        focusAndMoveCursorToEnd(focusField);
      });
    }

    inputs.forEach((input, index) => {

      input.addEventListener("keydown", function (e) {

        if (e.key === "Enter") {
          e.preventDefault();

          if (isEmpty(input)) return;

          const next = inputs[index + 1];

          if (next) {
            focusAndMoveCursorToEnd(next);
          } else {

            const allFilled = inputs.every(el =>
              el.tagName === "SELECT" || !isEmpty(el)
            );

            if (allFilled) {
              const btn = form.querySelector(
                "button[type=submit], input[type=submit]"
              );
              if (btn) btn.click();
            } else {
              alert("Please fill all fields before submitting.");
            }
          }
        }

        else if (e.key === "Backspace") {
          if (input.tagName === "SELECT" || isEmpty(input)) {
            e.preventDefault();
            if (index > 0) {
              focusAndMoveCursorToEnd(inputs[index - 1]);
            }
          }
        }

      });

      input.addEventListener("focus", () => {
        inputs.forEach(i => i.classList.remove("focused-field"));
        input.classList.add("focused-field");
      });

    });

  });

});
</script>

<style>
.focused-field {
  outline: 2px solid #0d6efd;
  background-color: #eef5ff;
  transition: background-color 0.2s ease;
}
</style>
