<!doctype html>
<html lang="en">
  {% include "menu_bar.html" %}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>new job creation</title>

    <style>
      /* Improved UI Variables */
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --border: #e2e8f0;
        --bg: #f8fafc;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --white: #ffffff;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text-main);
        margin: 0;

        /* Center .bill-card */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; /* full viewport height */
      }

      .bill-card {
        max-width: 1000px;
        width: 100%;
        background: var(--white);
        padding: 32px;
        border-radius: 16px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 10px 15px -3px rgba(0, 0, 0, 0.05);
      }

      h2 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      /* Header Grid */
      .form-header {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-bottom: 32px;
      }

      .input-group {
        position: relative;
      }

      label {
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--text-muted);
      }

      input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        color: var(--text-main);
        box-sizing: border-box;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        background: #fff;
      }

      input:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }

      /* Dropdown/Suggestions Menu */
      .suggestions {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        max-height: 220px;
        overflow-y: auto;
        z-index: 10000; /* increase z-index */
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
        padding: 4px;
        pointer-events: auto; /* ensure it receives clicks */
      }

      .suggestions div {
        padding: 10px 12px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
        transition: background 0.15s;
      }

      .suggestions div:hover,
      .suggestions div.active {
        background: #f1f5f9;
        color: var(--primary);
      }

      /* Table Area */
      .table-wrapper {
        margin-top: 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: visible; /* Clips the table corners to the border-radius */
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
      }

      th {
        background: #f8fafc;
        padding: 12px 16px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      td {
        padding: 10px 16px;
        border-bottom: 1px solid #f1f5f9;
        background: #fff;
      }

      input[readonly] {
        background: #f8fafc;
        border-color: transparent;
        color: var(--text-muted);
      }

      /* Delete Button */
      .btn-remove {
        border: none;
        background: #fee2e2;
        color: #ef4444;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .btn-remove:hover {
        background: #fecaca;
        color: #dc2626;
      }

      /* Action Button */
      button[onclick="submitData()"] {
        margin-top: 32px;
        padding: 14px;
        width: 100%;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
      }

      button[onclick="submitData()"]:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      /* Debug Console */
      pre {
        background: #0f172a;
        color: #38bdf8;
        padding: 16px;
        border-radius: 10px;
        margin-top: 20px;
        font-family: "Fira Code", "Courier New", monospace;
        font-size: 13px;
        border: 1px solid #1e293b;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      body {
        margin: auto;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: auto;
        background: linear-gradient(
          315deg,
          rgba(101, 0, 94, 1) 3%,
          rgba(60, 132, 206, 1) 38%,
          rgba(48, 238, 226, 1) 68%,
          rgba(255, 25, 25, 1) 98%
        );
        animation: gradient 15s ease infinite;
        background-size: 400% 400%;
        background-attachment: fixed;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 0%;
        }
        50% {
          background-position: 100% 100%;
        }
        100% {
          background-position: 0% 0%;
        }
      }

      .wave {
        background: rgb(255 255 255 / 25%);
        border-radius: 1000% 1000% 0 0;
        position: fixed;
        width: 200%;
        height: 12em;
        animation: wave 10s -3s linear infinite;
        transform: translate3d(0, 0, 0);
        opacity: 0.8;
        bottom: 0;
        left: 0;
        z-index: -1;
      }

      .wave:nth-of-type(2) {
        bottom: -1.25em;
        animation: wave 18s linear reverse infinite;
        opacity: 0.8;
      }

      .wave:nth-of-type(3) {
        bottom: -2.5em;
        animation: wave 20s -1s reverse infinite;
        opacity: 0.9;
      }

      @keyframes wave {
        2% {
          transform: translateX(1);
        }

        25% {
          transform: translateX(-25%);
        }

        50% {
          transform: translateX(-50%);
        }

        75% {
          transform: translateX(-25%);
        }

        100% {
          transform: translateX(1);
        }
      }
    </style>
  </head>

  <body>
    <div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

    <div class="bill-card">
      <h2>Job Card Entry</h2>

      <div class="form-header">
        <div class="input-group">
          <label>Master Nama</label>
          <input id="custInput" autocomplete="off" placeholder="ID or Name" />
          <div id="custSug" class="suggestions" hidden></div>
        </div>
        <div class="input-group">
          <label>Billing Date</label>
          <input type="date" id="billDate" readonly />
        </div>
      </div>

      <div class="table-wrapper">
        <table id="billTable">
          <thead>
            <tr>
              <th width="25%">Item ID / Search</th>
              <th width="25%">Item Name</th>
              <th width="10%">Colour</th>
              <th width="5">type</th>
              <th width="10%">Pics</th>
              <th width="13%">KG</th>
              <th width="2%"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div
        style="
          margin-top: 12px;
          text-align: right;
          font-weight: 600;
          color: var(--text-main);
        "
      >
        Total pics:
        <span id="totalpic">0</span> pics
      </div>
      <div
        style="
          margin-top: 12px;
          text-align: right;
          font-weight: 600;
          color: var(--text-main);
        "
      >
        Total Weight:
        <span id="totalKg">0.00</span> KG
      </div>
      <h2 id="error-message" hidden>erroe</h2>

      <button onclick="submitData()">Submit Bill</button>
      <div
        id="summaryBox"
        style="
          margin-top: 20px;
          padding: 15px;
          border: 1px solid #ddd;
          border-radius: 8px;
          background: #fafafa;
        "
      >
        <h3 style="margin-top: 0">Summary</h3>
        <div id="summaryContent">No data yet</div>
      </div>
      <pre id="output" hidden="hidden">// JSON Response will appear here</pre>
    </div>

    <script>
                                                      /* ================= DATA ================= */
                                                      {% if data %}
                                                      const outworker = {{data["outworker"] | tojson }};

                                                      const inventory = {{data["product"] | tojson}};
                                                      {% endif %}
                                                      /* ================= DOM ================= */
                                                      const custInput = document.getElementById("custInput");
                                                      const custSug = document.getElementById("custSug");
                                                      const tbody = document.querySelector("#billTable tbody");
                                                      const billDate = document.getElementById("billDate");
                                                      const output = document.getElementById("output");

                                                      /* ================= HELPER ================= */
                                                      function focusField(el) {
                                                        if (!el) return;
                                                        el.focus({ preventScroll: true });
                                                        el.scrollIntoView({ behavior: "smooth", block: "center" });
                                                        if (el.type === "text" || el.type === "number") {
                                                          const len = el.value.length;
                                                          setTimeout(() => el.setSelectionRange(len, len), 0);
                                                        }
                                                      }

                                                      function makeSuggestionsInteractive(input, suggestions, items, onSelect) {
                                                        let activeIndex = -1;

                                                        function render() {
                                                          suggestions.innerHTML = "";
                                                          items.forEach((item, i) => {
                                                            const div = document.createElement("div");
                                                            div.textContent = item;
                                                            if (i === activeIndex) div.classList.add("active");
                                                            div.addEventListener("pointerdown", (e) => {
                                                              e.preventDefault();
                                                              onSelect(item);
                                                              suggestions.hidden = true;
                                                            });
                                                            suggestions.appendChild(div);
                                                          });
                                                          suggestions.hidden = items.length === 0;
                                                        }

                                                        input.addEventListener("keydown", (e) => {
                                                          const max = items.length - 1;
                                                          if (e.key === "ArrowDown") {
                                                            e.preventDefault();
                                                            activeIndex = activeIndex < max ? activeIndex + 1 : 0;
                                                            render();
                                                          } else if (e.key === "ArrowUp") {
                                                            e.preventDefault();
                                                            activeIndex = activeIndex > 0 ? activeIndex - 1 : max;
                                                            render();
                                                          } else if (e.key === "Enter") {
                                                            if (activeIndex >= 0 && items[activeIndex]) {
                                                              e.preventDefault();
                                                              onSelect(items[activeIndex]);
                                                              suggestions.hidden = true;
                                                              activeIndex = -1;
                                                            }
                                                          }
                                                        });

                                                        render();
                                                      }

                                                      /* ================= CUSTOMER AUTOCOMPLETE ================= */
                                                      custInput.addEventListener("input", () => {
                                                        const v = custInput.value.trim().toLowerCase();
                                                        if (!v) return (custSug.hidden = true);

                                                        const filtered = outworker
                                                          .filter(
                                                            (c) => String(c.id).includes(v) || c.name.toLowerCase().includes(v)
                                                          )
                                                          .map((c) => c.full);

                                                        makeSuggestionsInteractive(custInput, custSug, filtered, (val) => {
                                                          custInput.value = val;
                                                          focusField(tbody.querySelector(".item-id"));
                                                        });
                                                      });

                                                      custInput.addEventListener("blur", () =>
                                                        setTimeout(() => (custSug.hidden = true), 120)
                                                      );

                                                      /* ================= TABLE ROW ================= */
                                                      function addRow() {
                                                        const tr = document.createElement("tr");
                                                        tr.innerHTML = `
                                                    <td>
                                                      <div class="input-group">
                                                        <input class="item-id" autocomplete="off" placeholder="Item ID / Name">
                                                        <div class="suggestions" hidden></div>
                                                      </div>
                                                    </td>
                                                    <td><input class="item-name" readonly></td>
                                                    <td><input class="item-colour" readonly></td>
                                                    <td><input class="item-type" readonly></td>
                                                    <td><input type="number" min="1" class="item-qty" readonly></td>
                                                <td>
                                                  <input
                                                    type="number"
                                                    min="0"
                                                    step="0.01"
                                                    class="item-kg"
                                                    placeholder="0.00"
                                                    readonly>

                                                </td>
                                                    <td><button type="button" class="btn-remove">×</button></td>
                                                  `;

                                                        const idInput = tr.querySelector(".item-id");
                                                        const sug = tr.querySelector(".suggestions");
                                                        idInput.addEventListener("input", () => {
                                            const raw = idInput.value.trim();

                                            // 🔥 First check QR
                                            if (handleQRInput(raw, tr, idInput)) return;

                                            // ---- Normal autocomplete continues below ----
                                            const v = raw.toLowerCase();
                                            if (!v) return (sug.hidden = true);

                                            const usedIds = new Set(
                                              [...tbody.querySelectorAll(".item-id")]
                                                .filter(input => input !== idInput)
                                                .map(input => input.value.trim())
                                                .filter(Boolean)
                                            );

                                            const filtered = inventory
                                              .filter(i => {
                                                const idStr = String(i.id);
                                                return (
                                                  !usedIds.has(idStr) &&
                                                  (idStr.includes(v) || i.name.toLowerCase().includes(v))
                                                );
                                              })
                                              .map(i => `${i.id}--${i.name}--${i.colour}--${i.pics}`);

                                            makeSuggestionsInteractive(idInput, sug, filtered, (val) => {
                                              const [idStr] = val.split("--");
                                              const item = inventory.find(it => String(it.id) === idStr);
                                              if (!item) return;

                                              idInput.value = item.id;
                                              tr.querySelector(".item-name").value = item.name;
                                              tr.querySelector(".item-colour").value = item.colour;
                                              tr.querySelector(".item-type").value = item.type;
                                              tr.querySelector(".item-qty").value = item.pics;
                                              tr.querySelector(".item-kg").value = item.kg;

                                              updateTotalKg();
                                              updadateTotalPics();
                                              updateSummaryTab()
                                              sug.hidden = true;

                                              if (tr === tbody.lastElementChild) addRow();
                                            });
                                          });
                                                        idInput.addEventListener("input", () => {
                                                          const v = idInput.value.trim().toLowerCase();
                                                          if (!v) return (sug.hidden = true);

                                                          const usedIds = new Set(
                                                  [...tbody.querySelectorAll(".item-id")]
                                                    .filter(input => input !== idInput)   // 🔑 exclude current row
                                                    .map(input => input.value.trim())
                                                    .filter(Boolean)
                                                );

                                                         const filtered = inventory
                                                  .filter(i => {
                                                    const idStr = String(i.id);
                                                     return (
                                                      !usedIds.has(idStr) &&
                                                      (idStr.includes(v) || i.name.toLowerCase().includes(v))
                                                    );
                                                  })
                                                  .map(i => `${i.id}--${i.name}--${i.colour}--${i.pics}`);


                                                          makeSuggestionsInteractive(idInput, sug, filtered, (val) => {
                                                            const [idStr] = val.split(" - ");

                                                            // Prevent duplicate items
                                                            const alreadyExists = usedIds.has(idStr);


                                                            if (alreadyExists) {
                                                               alert("This item is already added.");
                                                               sug.hidden = true;
                                                               return;
                                                             }

                                                            const item = inventory.find((it) => String(it.id) === idStr);
                                                            if (!item) return;

                                                            idInput.value = item.id;
                                                            tr.querySelector(".item-name").value = item.name;
                                                            tr.querySelector(".item-colour").value = item.colour;
                                                            tr.querySelector(".item-type").value = item.type;
                                                            tr.querySelector(".item-qty").value = item.pics;
                                                            tr.querySelector(".item-kg").value = item.kg;
                                                            updateTotalKg();
                                                            updadateTotalPics()
                                                            updateSummaryTab();
                                                            sug.hidden = true;

                                                            if (tr === tbody.lastElementChild) addRow();
                                                          });
                                                        });

                                                        idInput.addEventListener("blur", () =>
                                                          setTimeout(() => (sug.hidden = true), 120)
                                                        );

                                                        tr.querySelector(".btn-remove").addEventListener("click", () => {
                                                          if (tbody.rows.length > 1) tr.remove();
                                                          else tr.querySelectorAll("input").forEach((i) => (i.value = ""));
                                                          updateTotalKg();
                                                            updadateTotalPics()
                                                            updateSummaryTab();
                                                        });

                                                        tbody.appendChild(tr);
                                                      }

                                                      /* ================= INIT ================= */
                                                      addRow();
                                                      billDate.valueAsDate = new Date();

                                                      // Auto-focus customer input on page load
                                                      requestAnimationFrame(() => {
                                                        focusField(custInput);
                                                      });

                                                      /* ================= SUBMIT ================= */
                                                async function submitData() {
                                                  if (!custInput.value) return alert("Select customer");

                                                  const items = [...tbody.querySelectorAll("tr")]
                                                    .map((r) => ({
                                                      item_id: r.querySelector(".item-id").value,
                                                      name_of_prduct :  r.querySelector(".item-name").value,
                                                      type:r.querySelector(".item-type").value,
                                                      qty: Number(r.querySelector(".item-qty").value),
                                                      kg: Number(r.querySelector(".item-kg").value) || 0,
                                                    }))
                                                    .filter((i) => i.item_id && i.qty > 0);

                                                  if (!items.length) return alert("Add at least one item");

                                                  const payload = {
                                                    customer: custInput.value,
                                                    items,
                                                  };

                                                  try {
                                                    const res = await fetch("/submit-jobcard", {
                                                      method: "POST",
                                                      headers: { "Content-Type": "application/json" },
                                                      body: JSON.stringify(payload),
                                                    });

                                                    const data_R = await res.json();
                                                    console.log(data_R)
                                                    if (!res.ok) throw new Error("Submit failed");

                                                    if (!data_R.success){
                                                     const errorEl = document.getElementById("error-message");
                                                     errorEl.textContent = data_R.message;
                                                     console.log(data_R.message)
                                                    errorEl.hidden = false;

                                                    }
                                                    alert("Bill submitted");

                                                    /* ===== CLEAR EVERYTHING AFTER SUCCESS ===== */

                                                    // 1️⃣ clear table rows
                                                    tbody.innerHTML = "";

                                                    // 2️⃣ clear customer & date
                                                    custInput.value = "";
                                                    billDate.value = "";

                                                    // 3️⃣ clear output/debug
                                                    output.textContent = "";

                                                    // 4️⃣ focus first field (fast entry UX)
                                                    custInput.focus();
                                                    addRow()
                                                    updateTotalKg()
                                                    updadateTotalPics()
                                                    updateSummaryTab();
                                                    location.reload();

                                                <!--    output.textContent = JSON.stringify(data_R, null, 2)-->

                                                  } catch (err) {
                                                    console.error(err);
                                                    alert("Save failed");
                                                  }
                                                }


                                                      /* ================= ENTER NAVIGATION ================= */
                                                      document.addEventListener("keydown", (e) => {
                                                        const el = document.activeElement;

                                                        // Skip if suggestion dropdown is open
                                                        const sug = el.closest(".input-group")?.querySelector(".suggestions");
                                                         if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") {
                                                         submitData()}
                                                        if (sug && !sug.hidden) return;

                                                        if (e.key === "Enter") {
                                                          if (el.id === "custInput" && el.value.trim()) {
                                                            e.preventDefault();

                                                            focusField(tbody.querySelector(".item-id"));


                                                          } else if (el.classList.contains("item-id") && el.value.trim()) {
                                                            e.preventDefault();
                                                            const row = el.closest("tr");
                                                            const nextRow = row.nextElementSibling;
                                                            if (nextRow) {
                                                              focusField(nextRow.querySelector(".item-id"));
                                                            } else {
                                                              addRow();
                                                              focusField(tbody.lastElementChild.querySelector(".item-id"));
                                                            }
                                                          }
                                                        }

                                                        if (e.key === "Backspace") {
                                                          if (el.classList.contains("item-id") && !el.value) {
                                                            e.preventDefault();
                                                            const row = el.closest("tr");
                                                            const prevRow = row.previousElementSibling;
                                                            if (prevRow) focusField(prevRow.querySelector(".item-id"));
                                                            else focusField(custInput); // go back to customer input if first row
                                                          }
                                                        }
                                                      });
                                                      function updateTotalKg() {
                                                        let total = 0;
                                                        document.querySelectorAll(".item-kg").forEach((i) => {
                                                          total += Number(i.value) || 0;
                                                        });
                                                        document.getElementById("totalKg").innerText = total.toFixed(2);
                                                      }
                                                      function updadateTotalPics(){
                                                      let total_pic = 0 ;
                                                      document.querySelectorAll(".item-qty").forEach((i) => {
                                                          total_pic += Number(i.value) || 0;
                                                        });
                                                        document.getElementById("totalpic").innerText = total_pic.toFixed(2);
                                                      }
                                                      if (inventory.length == 0 ) {
                                                      console.log("no items")
                                                      output.removeAttribute("hidden")
                                                      output.textContent = "no item to give"
                                                    }
                                      function handleQRInput(rawValue, tr, idInput) {

                          // 🔹 Clean scanner junk (CR/LF/TAB etc.)
                          const clean = rawValue.replace(/[\r\n\t]/g, "").trim();

                          // 🔹 Flexible QR match (ignores extra characters at end)
                          const match = clean.match(/^(\d+)--(.+?)--(.+?)--(\d+(\.\d+)?)/);
                          if (!match) return false;

                          const idStr = match[1];

                          // 🔹 Find item only once
                          const item = inventory.find(i => String(i.id).trim() === idStr);
                          if (!item) {
                            alert("Item not found in inventory: " + idStr);
                            return true;
                          }

                          // 🔹 Check duplicate
                          const existingRow = [...tbody.querySelectorAll("tr")]
                            .find(row =>
                              row !== tr &&
                              row.querySelector(".item-id").value.trim() === idStr
                            );

                          if (existingRow) {
                            alert("Item already added.");
                            return true;
                          }

                          // 🔹 Fill row (always use inventory data for consistency)
                          idInput.value = item.id;
                          tr.querySelector(".item-id").value = item.id;
                          tr.querySelector(".item-name").value = item.name;
                          tr.querySelector(".item-colour").value = item.colour;
                          tr.querySelector(".item-type").value = item.type;
                          tr.querySelector(".item-qty").value = item.pics;
                          tr.querySelector(".item-kg").value = item.kg;

                          updateTotalKg(); updadateTotalPics();updateSummaryTab();
                          // 🔒 Lock this input so scanner cannot continue typing
                  idInput.setAttribute("readonly", true);

                  // Add next row if needed
                  if (tr === tbody.lastElementChild) {
                    addRow();
                  }

                  // Move safely to next row
                  setTimeout(() => {

                    // Unlock previous input after scanner fully stops
                    idInput.removeAttribute("readonly");

                    const nextRow = tr.nextElementSibling;
                    if (nextRow) {
                      const nextInput = nextRow.querySelector(".item-id");
                      focusField(nextInput);
                    }

                  }, 80); // small delay prevents extra scanner characters

                  return true;
                        }
        function updateSummaryTab() {
        const container = document.getElementById("summaryContent");
        if (!container) return;

        const rows = [...tbody.querySelectorAll("tr")];
        const summaryMap = {};

        rows.forEach(row => {
          const name = row.querySelector(".item-name")?.value || "";
          const type = row.querySelector(".item-type")?.value || "";
          const qty  = Number(row.querySelector(".item-qty")?.value || 0);

          if (!name || !type || !qty) return;

          const key = name + "||" + type + "||" + qty;

          if (!summaryMap[key]) {
            summaryMap[key] = { name, type, qty, count: 0 };
          }

          summaryMap[key].count++;
        });

        if (!Object.keys(summaryMap).length) {
          container.innerHTML = "No data yet";
          return;
        }

        let html = `
          <table style="width:100%; border-collapse:collapse;">
            <tr>
              <th style="text-align:left;">Product</th>
              <th style="text-align:left;">Type</th>
              <th style="text-align:left;">Pattern</th>
            </tr>
        `;

        Object.values(summaryMap).forEach(item => {
          const total = item.qty * item.count;
          html += `
            <tr>
              <td>${item.name}</td>
              <td>${item.type}</td>
              <td><strong>${item.qty}×${item.count}</strong> = ${total}</td>
            </tr>
          `;
        });

        html += "</table>";
        container.innerHTML = html;
      }
    </script>
    <style>
      .suggestions div.active {
        background: #e0e7ff;
        color: #4338ca;
      }
    </style>
  </body>
</html>
