<!doctype html>
<html lang="en">
  {% include "menu_bar.html" %}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>new job creation</title>

    <style>
      /* Improved UI Variables */
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --border: #e2e8f0;
        --bg: #f8fafc;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --white: #ffffff;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text-main);
        margin: 0;

        /* Center .bill-card */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; /* full viewport height */
      }

      .bill-card {
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        background: var(--white);
        padding: 32px;
        border-radius: 24px;
        box-shadow: var(--shadow-lg);
        position: relative;
        z-index: 1;
        max-height: 90vh;
        overflow-y: auto;
        overflow-x: auto;
        scroll-behavior: smooth;
        margin-top: 100px;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      /* Header Grid */
      .form-header {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-bottom: 32px;
      }

      .input-group {
        position: relative;
      }

      label {
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--text-muted);
      }

      input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        color: var(--text-main);
        box-sizing: border-box;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        background: #fff;
      }

      input:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }

      /* Dropdown/Suggestions Menu */
      .suggestions {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        max-height: 220px;
        overflow-y: auto;
        z-index: 10000; /* increase z-index */
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
        padding: 4px;
        pointer-events: auto; /* ensure it receives clicks */
      }

      .suggestions div {
        padding: 10px 12px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
        transition: background 0.15s;
      }

      .suggestions div:hover,
      .suggestions div.active {
        background: #f1f5f9;
        color: var(--primary);
      }

      /* Table Area */
      .table-wrapper {
        margin-top: 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: visible; /* Clips the table corners to the border-radius */
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
      }

      th {
        background: #f8fafc;
        padding: 12px 16px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      td {
        padding: 10px 16px;
        border-bottom: 1px solid #f1f5f9;
        background: #fff;
      }

      input[readonly] {
        background: #f8fafc;
        border-color: transparent;
        color: var(--text-muted);
      }

      /* Delete Button */
      .btn-remove {
        border: none;
        background: #fee2e2;
        color: #ef4444;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .btn-remove:hover {
        background: #fecaca;
        color: #dc2626;
      }

      /* Action Button */
      button[onclick="submitData()"] {
        margin-top: 32px;
        padding: 14px;
        width: 100%;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
      }

      button[onclick="submitData()"]:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      /* Debug Console */
      pre {
        background: #0f172a;
        color: #38bdf8;
        padding: 16px;
        border-radius: 10px;
        margin-top: 20px;
        font-family: "Fira Code", "Courier New", monospace;
        font-size: 13px;
        border: 1px solid #1e293b;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      body {
        margin: auto;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: auto;
        background: linear-gradient(
          315deg,
          rgba(101, 0, 94, 1) 3%,
          rgba(60, 132, 206, 1) 38%,
          rgba(48, 238, 226, 1) 68%,
          rgba(255, 25, 25, 1) 98%
        );
        animation: gradient 15s ease infinite;
        background-size: 400% 400%;
        background-attachment: fixed;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 0%;
        }
        50% {
          background-position: 100% 100%;
        }
        100% {
          background-position: 0% 0%;
        }
      }

      .wave {
        background: rgb(255 255 255 / 25%);
        border-radius: 1000% 1000% 0 0;
        position: fixed;
        width: 200%;
        height: 12em;
        animation: wave 10s -3s linear infinite;
        transform: translate3d(0, 0, 0);
        opacity: 0.8;
        bottom: 0;
        left: 0;
        z-index: -1;
      }

      .wave:nth-of-type(2) {
        bottom: -1.25em;
        animation: wave 18s linear reverse infinite;
        opacity: 0.8;
      }

      .wave:nth-of-type(3) {
        bottom: -2.5em;
        animation: wave 20s -1s reverse infinite;
        opacity: 0.9;
      }

      @keyframes wave {
        2% {
          transform: translateX(1);
        }

        25% {
          transform: translateX(-25%);
        }

        50% {
          transform: translateX(-50%);
        }

        75% {
          transform: translateX(-25%);
        }

        100% {
          transform: translateX(1);
        }
      }
      /* Sticky Header */
      .form-header {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
        position: sticky;
        top: 0;
        background: var(--white);
        z-index: 100;
        padding: 16px 0;
        margin-top: -16px;
        border-bottom: 1px solid var(--border);
      }
    </style>
  </head>

  <body>
    <div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

    <div class="bill-card">
      <h2>Job Card Entry</h2>

      <div class="table-wrapper">
        <table id="billTable">

              <th style="width: 10%">Type</th>
              <th style="width: 10%">Pics</th>
              <th style="width: 10%">KG</th>
              <th style="width: 9%">Avg KG</th>
              <th style="width: 9%">Avg cloth</th>
              <th style="width: 2%"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div
        style="
          margin-top: 12px;
          text-align: right;
          font-weight: 600;
          color: var(--text-main);
        "
      >
        Total pics:
        <span id="totalpic">0</span> pics
      </div>
      <div
        style="
          margin-top: 12px;
          text-align: right;
          font-weight: 600;
          color: var(--text-main);
        "
      >
        Total Weight:
        <span id="totalKg">0.00</span> KG
      </div>
      <h2 id="error-message" hidden>erroe</h2>

      <button onclick="submitData()">Submit Job</button>
      <div
        id="summaryBox"
        style="
          margin-top: 20px;
          padding: 15px;
          border: 1px solid #ddd;
          border-radius: 8px;
          background: #fafafa;
        "
      >
        <h3 style="margin-top: 0">Summary</h3>
        <div id="summaryContent">No data yet</div>
      </div>
      <pre id="output" hidden="hidden">// JSON Response will appear here</pre>
    </div>

    <style>
      .suggestions div.active {
        background: #e0e7ff;
        color: #4338ca;
      }
    </style>
    <script src="static/js/job_isse.js"></script>
    {% include "side_bar.html" %}
  </body>
</html>
