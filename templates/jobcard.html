<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>new job creation</title>

    <style>
      /* Improved UI Variables */
:root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --white: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
}

/* Base Styles */
* {
    box-sizing: border-box;
}

body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: linear-gradient(315deg, rgba(101, 0, 94, 1) 3%, rgba(60, 132, 206, 1) 38%, rgba(48, 238, 226, 1) 68%, rgba(255, 25, 25, 1) 98%);
    animation: gradient 15s ease infinite;
    background-size: 400% 400%;
    background-attachment: fixed;
    overflow-y: auto;
    overflow-x: hidden;
    display: block;
}

@keyframes gradient {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
}

/* Animated Waves */
.wave {
    background: rgb(255 255 255 / 25%);
    border-radius: 1000% 1000% 0 0;
    position: fixed;
    width: 200%;
    height: 12em;
    animation: wave 10s -3s linear infinite;
    transform: translate3d(0, 0, 0);
    opacity: 0.8;
    bottom: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
}

.wave:nth-of-type(2) {
    bottom: -1.25em;
    animation: wave 18s linear reverse infinite;
    opacity: 0.8;
}

.wave:nth-of-type(3) {
    bottom: -2.5em;
    animation: wave 20s -1s reverse infinite;
    opacity: 0.9;
}

@keyframes wave {
    2% { transform: translateX(1); }
    25% { transform: translateX(-25%); }
    50% { transform: translateX(-50%); }
    75% { transform: translateX(-25%); }
    100% { transform: translateX(1); }
}

/* Main Card */
.bill-card {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    background: var(--white);
    padding: 32px;
    border-radius: 24px;
    box-shadow: var(--shadow-lg);
    position: relative;
    z-index: 1;
    max-height: 90vh;
    overflow-y: auto;
    overflow-x: auto;
    scroll-behavior: smooth;
}

/* Custom Scrollbar */
.bill-card::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.bill-card::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
}

.bill-card::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
}

.bill-card::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}

/* Headings */
h2 {
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 1.875rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, #000, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* Sticky Header */
.form-header {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
    position: sticky;
    top: 0;
    background: var(--white);
    z-index: 100;
    padding: 16px 0;
    margin-top: -16px;
    border-bottom: 1px solid var(--border);
}

/* Input Groups */
.input-group {
    position: relative;
    width: 100%;
}

label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-muted);
}

input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text-main);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    background: #fff;
}

input:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

input[readonly] {
    background: #f8fafc;
    border-color: transparent;
    color: var(--text-muted);
    cursor: not-allowed;
}

/* Suggestions Dropdown */
.suggestions,
.item-suggestions {
    position: fixed;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 250px;
    overflow-y: auto;
    z-index: 10000;
    box-shadow: var(--shadow-lg);
    padding: 4px;
    min-width: 250px;
}

.suggestions div,
.item-suggestions div {
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 14px;
    transition: background 0.15s;
    border-bottom: 1px solid #f1f5f9;
}

.suggestions div:last-child,
.item-suggestions div:last-child {
    border-bottom: none;
}

.suggestions div:hover,
.item-suggestions div:hover,
.suggestions div.active,
.item-suggestions div.active {
    background: #f1f5f9;
    color: var(--primary);
}

/* Scrollable Table Wrapper */
.table-wrapper {
    margin-top: 24px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    overflow-y: auto;
    max-height: calc(90vh - 280px);
    background: var(--white);
    position: relative;
}

/* Table Styles */
#billTable {
    width: 100%;
    border-collapse: collapse;
    min-width: 1000px;
}

th {
    background: #f8fafc;
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    border-bottom: 2px solid var(--border);
    text-align: left;
}

td {
    padding: 10px 16px;
    border-bottom: 1px solid #f1f5f9;
    background: #fff;
    vertical-align: middle;
}

/* Sticky Table Header */
#billTable thead th {
    position: sticky;
    top: 0;
    background: #f8fafc;
    z-index: 10;
    box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1);
}

/* Table Row Hover */
#billTable tbody tr:hover {
    background-color: #f9fafb;
}

/* Delete Button */
.btn-remove {
    border: none;
    background: #fee2e2;
    color: #ef4444;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.btn-remove:hover {
    background: #fecaca;
    color: #dc2626;
    transform: scale(1.05);
}

/* Add Row Button */
.add-row-btn {
    margin-top: 16px;
    padding: 10px 20px;
    background: #f1f5f9;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.add-row-btn:hover {
    background: #e2e8f0;
    transform: translateY(-1px);
}

/* Totals Section */
.totals-section {
    margin-top: 20px;
    padding: 16px;
    background: #f8fafc;
    border-radius: 12px;
    display: flex;
    justify-content: flex-end;
    gap: 32px;
    font-weight: 600;
}

.total-item {
    display: flex;
    gap: 8px;
    align-items: baseline;
}

.total-label {
    color: var(--text-muted);
    font-size: 0.875rem;
}

.total-value {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
}

/* Submit Button */
  /* Delete Button */
      .btn-remove {
        border: none;
        background: #fee2e2;
        color: #ef4444;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .btn-remove:hover {
        background: #fecaca;
        color: #dc2626;
      }

      /* Action Button */
      button[onclick="submitData()"] {
        margin-top: 32px;
        padding: 14px;
        width: 100%;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
      }

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
}

/* Summary Box */
.summary-box {
    margin-top: 24px;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fafafa;
}

.summary-box h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 1.125rem;
    font-weight: 600;
}

#summaryContent {
    font-size: 0.875rem;
    line-height: 1.6;
    color: #111;;
}

/* Responsive Design */
@media (max-width: 768px) {
    body {
        padding: 10px;
    }

    .bill-card {
        padding: 20px;
        max-height: 95vh;
    }

    .form-header {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 12px 0;
    }

    .table-wrapper {
        max-height: calc(95vh - 240px);
    }

    #billTable {
        min-width: 800px;
    }

    th, td {
        padding: 8px 12px;
        font-size: 12px;
    }

    input {
        padding: 8px 10px;
        font-size: 12px;
    }

    .totals-section {
        flex-direction: column;
        gap: 12px;
        align-items: flex-end;
    }
}

/* Loading State */
.loading {
    opacity: 0.6;
    pointer-events: none;
}

/* Error Message */
.error-message {
    background: #fee2e2;
    color: #ef4444;
    padding: 12px;
    border-radius: 8px;
    margin-top: 16px;
    display: none;
}

.error-message.show {
    display: block;
}

/* Success Message */
.success-message {
    background: #d1fae5;
    color: #065f46;
    padding: 12px;
    border-radius: 8px;
    margin-top: 16px;
    display: none;
}

.success-message.show {
    display: block;
}
    </style>
